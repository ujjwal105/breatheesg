services:
  - type: web
    name: breathe-esg-api
    env: python
    rootDir: backend
    buildCommand: python3 -m pip install -r requirements.txt && python3 manage.py migrate
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.1
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: breatheesg-xc1w.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173,https://breathe-esg-web-ug5v.onrender.com
  - type: static
    name: breathe-esg-web
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://breathe-esg-api.onrender.com
